<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ASCENT — Cell Structure Editor (2u)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #15181c; color: #e8e3da; font: 13px/1.45 system-ui, sans-serif;
         display: flex; height: 100vh; overflow: hidden; }

  /* three columns: controls | schematic | 3D — a VERTICAL split, so both views stay large */
  #panel { width: 260px; flex: none; padding: 14px; overflow-y: auto; border-right: 1px solid #2b3038; }
  #twod  { flex: 1 1 55%; min-width: 0; overflow: auto; padding: 22px; position: relative; }
  #view3d { flex: 1 1 45%; min-width: 0; position: relative; }
  /* the grabber between the two views — 7px is wide enough to hit without hunting */
  #split { flex: none; width: 7px; cursor: col-resize; background: #2b3038; position: relative; }
  #split:hover, #split.drag { background: #3b6ea5; }
  #split::after { content: ''; position: absolute; inset: 0 -5px; }  /* forgiving hit area */
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing #view3d canvas { pointer-events: none; }  /* the orbit control must not steal the drag */
  #view3d canvas { display: block; }
  #v3label { position: absolute; left: 10px; top: 8px; font-size: 10px; letter-spacing: .08em;
             text-transform: uppercase; color: #7c8794; pointer-events: none; z-index: 2; }

  h1 { font-size: 15px; margin: 0 0 12px; }
  h2 { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: #7c8794; margin: 16px 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { padding: 6px 10px; border-radius: 6px; background: #232830; cursor: pointer; user-select: none;
          font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .chip.on { background: #3b6ea5; }
  .chip:hover { background: #2e3540; } .chip.on:hover { background: #4076b0; }
  .sw { width: 11px; height: 11px; border-radius: 2px; display: inline-block; border: 1px solid #0004; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; background: #232830; color: inherit;
           border: 0; cursor: pointer; }
  button:hover { background: #2e3540; }
  button.primary { background: #3b6ea5; } button.primary:hover { background: #4076b0; }
  button.danger { background: #7d3b3b; } button.danger:hover { background: #a04a4a; }
  input, select { font: inherit; padding: 5px 7px; border-radius: 5px; background: #1b1f25; color: inherit;
                  border: 1px solid #2b3038; }
  .item { display: flex; align-items: center; gap: 6px; background: #1b1f25; border-radius: 6px;
          padding: 5px 8px; margin-bottom: 4px; }
  .item .nm { flex: 1; cursor: pointer; } .item .nm:hover { color: #7fc8a0; }
  #ready { margin-top: 10px; font-size: 11px; white-space: pre-line; }
  #status { margin-top: 8px; color: #8a939d; font-size: 11px; }
  .hint { color: #6f7780; font-size: 11px; margin-top: 12px; max-width: 60ch; }
  svg { display: block; }

  /* the brush strip — pinned above the schematic so what you are painting is never scrolled away */
  #brushbar { position: sticky; top: -22px; z-index: 3; display: flex; align-items: center; gap: 9px;
              background: #1b1f25; border: 1px solid #2b3038; border-radius: 8px;
              padding: 7px 11px; margin: -6px 0 16px; }
  #brushbar .bb-label { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: #7c8794; }
  #brushbar .bb-mode { font-weight: 600; }
  #brushbar .bb-vals { color: #9aa3ad; }
  #brushbar .bb-hint { margin-left: auto; color: #6f7780; font-size: 11px; }

  /* the key, under the grid */
  #legend { margin-top: 26px; max-width: 70ch; border-top: 1px solid #2b3038; padding-top: 4px; }
  #legend .legend-rows { display: flex; flex-wrap: wrap; gap: 5px 14px; }
  #legend .legend-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9aa3ad; }

  /* modal — save and delete both confirm, rather than firing on a stray click */
  #veil { position: fixed; inset: 0; background: #0009; display: none; align-items: center;
          justify-content: center; z-index: 50; }
  #veil.on { display: flex; }
  #modal { background: #1b1f25; border: 1px solid #2b3038; border-radius: 10px; padding: 20px;
           min-width: 340px; box-shadow: 0 20px 60px #0008; }
  #modal h3 { margin: 0 0 10px; font-size: 14px; }
  #modal p { margin: 0 0 14px; color: #9aa3ad; font-size: 12px; }
  #modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
</style>
</head>
<body>
  <div id="panel"></div>
  <div id="twod">
    <div id="brushbar"></div>
    <svg id="grid"></svg>
    <div class="hint" id="hint"></div>
    <div id="legend"></div>
  </div>
  <div id="split" title="drag to resize"></div>
  <div id="view3d"><div id="v3label">3D — what the generator will build</div></div>
  <div id="veil"><div id="modal"></div></div>
  <script type="module" src="/src/lab/cell-editor.ts"></script>
</body>
</html>
